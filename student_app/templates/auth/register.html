{% extends "base.html" %}

{% block title %}Register Student Account{% endblock %}

{% block content_no_sidebar %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="glass-panel p-4 p-md-5 border border-success">
            <div class="text-center mb-4">
                <div class="rounded-circle p-3 d-inline-flex mb-3" style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--emerald-accent);">
                    <i class="bi bi-person-plus-fill text-emerald fs-2"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Create Student Account</h3>
                <p class="text-muted small">Join Coventry University AI Learning Platform</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label text-white-50 small fw-bold">Username</label>
                        <input type="text" class="form-control form-control-glass" id="username" name="username" placeholder="alex_scholar" required autofocus>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label text-white-50 small fw-bold">Email Address</label>
                        <input type="email" class="form-control form-control-glass" id="email" name="email" placeholder="student@coventry.ac.uk" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="university" class="form-label text-white-50 small fw-bold">University / Institution</label>
                        <input type="text" class="form-control form-control-glass" id="university" name="university" value="Coventry University" required>
                    </div>
                    <div class="col-md-6">
                        <label for="degree_program" class="form-label text-white-50 small fw-bold">Degree / Course</label>
                        <input type="text" class="form-control form-control-glass" id="degree_program" name="degree_program" placeholder="MSc Computer Science" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="password" class="form-label text-white-50 small fw-bold">Password</label>
                        <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="Minimum 6 characters" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label text-white-50 small fw-bold">Confirm Password</label>
                        <input type="password" class="form-control form-control-glass" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-emerald w-100 py-2.5 mb-3">
                    <i class="bi bi-check-circle-fill me-2"></i> Register & Access Dashboard
                </button>
            </form>

            <div class="text-center pt-3 border-top border-secondary">
                <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-emerald fw-semibold">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
