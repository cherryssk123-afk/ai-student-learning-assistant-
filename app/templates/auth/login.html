{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content_no_sidebar %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="glass-panel p-4 p-md-5 border border-success">
            <div class="text-center mb-4">
                <div class="rounded-circle p-3 d-inline-flex mb-3" style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--emerald-accent);">
                    <i class="bi bi-box-arrow-in-right text-emerald fs-2"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to access your guided study pathways</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-3">
                    <label for="username_or_email" class="form-label text-white-50 small fw-bold">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-emerald"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-glass" id="username_or_email" name="username_or_email" placeholder="student@coventry.ac.uk" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-white-50 small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-emerald"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember" checked>
                        <label class="form-check-label text-muted small" for="remember">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-emerald w-100 py-2.5 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Learning Portal
                </button>
            </form>

            <div class="text-center pt-3 border-top border-secondary">
                <p class="text-muted small mb-0">Don't have a student account? <a href="{{ url_for('auth.register') }}" class="text-emerald fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
